<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLoN Kit — Инструменты</title>
    <style>
        /* ========== ОСНОВНЫЕ СТИЛИ (как в калькуляторе) ========== */
        :root {
            --bg: #f6f8fb;
            --card: #fff;
            --border: #f0f2f5;
            --text: #0d0d0d;
            --text2: #1f2937;
            --text3: #6b7280;
            --shadow: 0 8px 30px rgba(0,0,0,0.06);
            --player-border: #4d6bfe;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card: #16213e;
            --border: #2a2a4a;
            --text: #e8e8f0;
            --text2: #c8c8d8;
            --text3: #8888aa;
            --shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background .3s;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            transition: background .3s, border .3s;
        }
        .header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .theme-toggle {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: .15s;
        }
        .theme-toggle:hover {
            background: var(--border);
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .subhead {
            font-size: 16px;
            color: var(--text3);
            margin-bottom: 32px;
            border-left: 3px solid #4d6bfe;
            padding-left: 14px;
            display: inline-block;
        }
        .tools {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }
        .tool-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 22px 24px;
            border: 2px solid var(--border);
            transition: .2s;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 18px;
            text-align: left;
        }
        .tool-card:hover {
            border-color: #4d6bfe;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(77, 107, 254, 0.08);
        }
        .tool-icon {
            font-size: 32px;
            flex-shrink: 0;
        }
        .tool-info h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--text);
        }
        .tool-info p {
            font-size: 14px;
            color: var(--text3);
            margin: 0;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text3);
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .footer span {
            background: var(--bg);
            padding: 2px 12px;
            border-radius: 30px;
        }
        @media (max-width: 500px) {
            .container { padding: 24px 18px; }
            h1 { font-size: 26px; }
            .tool-card { flex-direction: column; text-align: center; gap: 8px; padding: 18px; }
            .tool-icon { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="theme-toggle" id="themeBtn">🌓 Тема</button>
        </div>
        <h1>🛠️ TLoN Kit</h1>
        <div class="subhead">Инструменты для игры</div>

        <div class="tools">
            <a href="calc/index.html" class="tool-card">
                <span class="tool-icon">📊</span>
                <div class="tool-info">
                    <h2>Калькулятор крита и блока</h2>
                    <p>Расчёт шансов крита, блока и среднего урона</p>
                </div>
            </a>
            <a href="sim/index.html" class="tool-card">
                <span class="tool-icon">🛡️</span>
                <div class="tool-info">
                    <h2>Симулятор эмблем гильдии</h2>
                    <p>Подбор эмблем для максимальных цветовых очков</p>
                </div>
            </a>
        </div>

        <div class="footer">
            <span>⚡ TLoN Kit · 2026</span>
        </div>
    </div>

    <script>
        // Тёмная тема
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('tlon_main_theme', next);
        }
        const savedTheme = localStorage.getItem('tlon_main_theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
    </script>
</body>
</html>
